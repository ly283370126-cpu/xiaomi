name: Build installable packages
on:
  push:
    paths: ['plugin/**', 'watch/**', 'scripts/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust WASI target
        run: rustup update stable && rustup target add wasm32-wasip2
      - name: Compile plugin
        working-directory: plugin
        run: cargo build --release --target wasm32-wasip2
      - name: Package ABP
        run: python3 scripts/package-plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: CodexWatch-ABP
          path: dist/CodexWatch.abp
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test core.test.mjs
